name: Replay Explorer
on:
  pull_request:
    paths: ['explorer/**', '.github/workflows/explorer.yml']
  push:
    branches: [main]
    paths: ['explorer/**', '.github/workflows/explorer.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
