[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "f1_pit_predictor"
version = "0.0.1"
description = "Machine Learning project with the goal to use historical data to predict the chances of a pit stop in Formula One. The project was first developped for my Bachelor thesis at the HEIG-VD."
authors = [
  { name = "Nelson Jeanrenaud" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known_first_party = ["f1_pit_predictor"]
force_sort_within_sections = true
